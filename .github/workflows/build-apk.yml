name: Build Android APK (OneRoof)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release OneRoof APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OneRoof-Shop.apk
          echo "APK successfully built: release-apk/OneRoof-Shop.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneRoof-Shop-APK
          path: release-apk/OneRoof-Shop.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: OneRoof Mobile App v1.0.0
          body: |
            ## OneRoof - অফিসিয়াল অ্যান্ড্রয়েড মোবাইল অ্যাপ (APK)
            
            আপনার ফোনের জন্য OneRoof শপিং অ্যাপটির ইনস্টলেবল APK ফাইল প্রস্তুত।
            
            ### যেভাবে ইনস্টল করবেন:
            1. নিচে থাকা `OneRoof-Shop.apk` ফাইলটিতে ক্লিক করে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলটি ওপেন করে 'Install' চাপুন।
            3. সহজে ও দ্রুত কেনাকাটা শুরু করুন!
          files: release-apk/OneRoof-Shop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
