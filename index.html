    <script>
      // Gracefully prevent unhandled errors/rejections/WebSocket issues in iframe preview
      (function() {
        function isIgnorable(err, e) {
          if (!err && !e) return true;

          // If ErrorEvent or PromiseRejectionEvent has no message/error/reason
          if (e && typeof e === 'object') {
            if (!e.message && !e.error && !e.reason) {
              return true;
            }
          }

          var msg = '';
          if (typeof err === 'string') {
            msg = err;
          } else if (err && typeof err === 'object') {
            msg = String(err.message || err.reason || (err.error && err.error.message) || '');
            if (!msg && err.error) {
              msg = String(err.error);
            }
          }

          msg = (msg || '').trim();
          if (!msg || msg === 'undefined' || msg === 'null' || msg === 'Script error.' || msg.indexOf('[object ') === 0) {
            return true;
          }

          var ignorableKeywords = [
            "reading 'send'",
            "reading 'addEventListener'",
            "WebSocket",
            "failed to connect",
            "Failed to fetch",
            "NetworkError",
            "Load failed",
            "cancelled",
            "ServiceWorker",
            "sandbox flags",
            "SecurityError",
            "before connect"
          ];
          for (var i = 0; i < ignorableKeywords.length; i++) {
            if (msg.indexOf(ignorableKeywords[i]) !== -1) return true;
          }
          return false;
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isIgnorable(msg || (error && error.message) || error)) {
            return true;
          }
          return false;
        };

        window.onunhandledrejection = function(event) {
          var reason = event ? (event.reason || event) : null;
          if (isIgnorable(reason, event)) {
            if (event && event.preventDefault) event.preventDefault();
            if (event && event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event && event.stopPropagation) event.stopPropagation();
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? (e.reason || e) : null;
          if (isIgnorable(reason, e)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var target = e ? (e.message || e.error || e) : null;
          if (isIgnorable(target, e)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
          }
        }, true);
      })();
    </script>
